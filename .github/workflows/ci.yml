# ── Auto-trigger disabled by pleme-io, 2026-08-08 ───────────────────────────
# UPSTREAM's own CI, vendored in with the crate, firing on every push to this
# PRIVATE fork and billing the org's Actions minutes to test a dependency we
# consume as a nix-built caixa and do not develop here.
#
# This file escaped the first sweep because its runner comes from a MATRIX
# (`runs-on: ${{ matrix.<var> }}`) rather than a literal, so a scan for bare
# `runs-on: ubuntu-*` did not see it. The billing is identical either way.
#
# The file is KEPT and stays runnable on demand (MODULARIZE, DON'T DELETE).
# The original trigger is preserved verbatim below.
#
# ORIGINAL TRIGGER:
# on:
#   pull_request:
#   push: # Run CI on the main branch after every merge. This is important to fill the GitHub Actions cache in a way that pull requests can see it
#     branches:
#       - main
#
on:
  workflow_dispatch:
name: continuous-integration

jobs:
  build-lint-test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        rust:
          - stable
        # Define the feature sets that will be built here (for caching you define a separate name)
        style: [bashisms, default, sqlite, basqlite, external_printer]
        include:
          - style: bashisms
            flags: "--features bashisms"
          - style: external_printer
            flags: "--features external_printer"
          - style: default
            flags: ""
          - style: sqlite
            flags: "--features sqlite"
          - style: basqlite
            flags: "--features bashisms,sqlite"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.3.4
      - name: Setup nextest
        uses: taiki-e/install-action@nextest

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy ${{ matrix.flags }} --all-targets --all -- -D warnings

      - name: Tests
        run: cargo nextest run --all ${{ matrix.flags }}

      - name: Check for clean repo
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "there are changes";
            git status --porcelain
            exit 1
          else
            echo "no changes in working directory";
          fi

      - name: Check lockfile
        run: cargo check --locked ${{ matrix.flags }} --all-targets --all

      - name: Doctests
        run: cargo test --doc ${{ matrix.flags }}
