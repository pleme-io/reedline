name: Typos
# ── Auto-trigger disabled by pleme-io, 2026-08-08 ───────────────────────────
# This is UPSTREAM's own CI, vendored in with the crate. It fired on every
# push to this PRIVATE fork and ran on GitHub-hosted runners, billing the
# org's Actions minutes to test a dependency we consume as a nix-built
# caixa and do not develop here. On 2026-08-08 that class of spend
# exhausted the org's Actions spending limit, after which EVERY private
# pleme-io repo refused to start any job at all.
#
# The standing rule: closed-source CI runs on Camelot self-hosted in
# akeyless-development, open-source runs on free GitHub-hosted minutes.
# Upstream's matrix does neither — so it does not run automatically.
#
# The file is KEPT and stays runnable on demand (MODULARIZE, DON'T
# DELETE). The original trigger is preserved verbatim below; restoring it
# is uncommenting it and deleting the workflow_dispatch stanza.
#
# ORIGINAL TRIGGER:
# on: [pull_request]
on:
  workflow_dispatch:

jobs:
  run:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@v4

      - name: Check spelling
        uses: crate-ci/typos@master
